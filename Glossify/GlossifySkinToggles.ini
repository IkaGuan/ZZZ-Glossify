; Generated by Glossify Patcher
; Global keybinds for toggling Body and Face gloss independently.
; x83 is patched body. y83 is patched face. The patch reads these, not the namespace.
namespace = GlossifySkinToggles

[Constants]
global persist $body_enabled = 1
global persist $face_enabled = 1
global $save_request = 0
global $mod_saved = 0
global $mod_style = 2
global $mod_strength = 1
global $prev_saved = 0
global $prev_style = 2
global $prev_strength = 1

[KeyGlossifyBodyToggle]
key = no_modifiers VK_MULTIPLY
type = cycle
smart = false
$body_enabled = 0,1
run = CommandListPublishToggles

[KeyGlossifyFaceToggle]
key = no_ctrl no_shift alt VK_MULTIPLY
type = cycle
smart = false
$face_enabled = 0,1
run = CommandListPublishToggles

[CommandListPublishToggles]
x83 = $body_enabled
y83 = $face_enabled

[Present]
run = CommandListPublishToggles
