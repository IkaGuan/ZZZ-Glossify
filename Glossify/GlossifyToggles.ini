; Glossify Toggles 1.0. Shows the current gloss state. It does not rebind or change it.
; Ctrl+Alt+F7 shows and hides the panel. Drag anywhere on it. A click on the X closes it.
; Oil style is Shift+Numpad *. Strength up is Numpad +. Strength down is Numpad -.
; Those three keys are the ones in the installed oil engine. This panel does not bind them.
namespace = GlossifyToggles

[Constants]
global persist $show = 0
global persist $px = 0.03
global persist $py = 0.12
global $drag = 0
global $arm = 0
global $dx = 0
global $dy = 0
global $click = 0
global $prevclick = 0
global $onx = 0
global $inside = 0
global $moved = 0
global $downx = 0
global $downy = 0
global $x2 = 0
global $y2 = 0
global $cx1 = 0
global $cx2 = 0
global $cy1 = 0
global $cy2 = 0
global $xhi = 0
global $xlo = 0
global $yhi = 0
global $ylo = 0
global $onsave = 0
global $savearm = 0

[KeyShow]
key = ctrl alt no_shift VK_F7
type = cycle
$pulse = 0,1
run = CommandListToggleShow

[CommandListToggleShow]
if $show == 0
    $show = 1
else
    $show = 0
    $drag = 0
    $arm = 0
endif

[KeyClick]
condition = $show && cursor_showing
key = VK_LBUTTON
type = hold
$click = 1
post $click = 0

[ResourceGlossifyFont]
filename = Font.dds

[CustomShaderGlossifyToggles]
hs = null
ds = null
gs = null
cs = null
run = BuiltInCommandListUnbindAllRenderTargets
vs = GlossifyToggles.hlsl
ps = GlossifyToggles.hlsl
ps-t101 = ResourceGlossifyFont
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = set_viewport bb
Draw = 4,0

[Present]
if $show == 0
    $drag = 0
    $arm = 0
else
    if cursor_showing
        $x2 = $px + 0.2604
        $y2 = $py + 0.5000
        $cx1 = $px + 0.233
        $cx2 = $px + 0.254
        $cy1 = $py + 0.007
        $cy2 = $py + 0.045
        $onx = 0
        $onsave = 0
        if cursor_x > $cx1
            if cursor_x < $cx2
                if cursor_y > $cy1
                    if cursor_y < $cy2
                        $onx = 1
                    endif
                endif
            endif
        endif
        if z83 == 1
            if cursor_x > $px + 0.006
                if cursor_x < $px + 0.120
                    if cursor_y > $py + 0.446
                        if cursor_y < $py + 0.484
                            $onsave = 1
                        endif
                    endif
                endif
            endif
        endif
        $inside = 0
        if cursor_x > $px
            if cursor_x < $x2
                if cursor_y > $py
                    if cursor_y < $y2
                        $inside = 1
                    endif
                endif
            endif
        endif
        if $click == 1
            if $prevclick == 0
                $arm = 0
                $drag = 0
                if $onx == 1
                    $arm = 1
                    $downx = cursor_x
                    $downy = cursor_y
                endif
                if $arm == 0
                    if $onsave == 1
                        $savearm = 1
                        $downx = cursor_x
                        $downy = cursor_y
                    endif
                endif
                if $arm == 0
                    if $savearm == 0
                        if $inside == 1
                            $drag = 1
                            $dx = cursor_x - $px
                            $dy = cursor_y - $py
                        endif
                    endif
                endif
            endif
        endif
        if $arm == 1
            if $click == 1
                $moved = 0
                $xhi = $downx + 0.012
                $xlo = $downx - 0.012
                $yhi = $downy + 0.012
                $ylo = $downy - 0.012
                if cursor_x > $xhi
                    $moved = 1
                endif
                if cursor_x < $xlo
                    $moved = 1
                endif
                if cursor_y > $yhi
                    $moved = 1
                endif
                if cursor_y < $ylo
                    $moved = 1
                endif
                if $moved == 1
                    $arm = 0
                    $drag = 1
                    $dx = cursor_x - $px
                    $dy = cursor_y - $py
                endif
                if $onx == 0
                    $arm = 0
                    $drag = 1
                    $dx = cursor_x - $px
                    $dy = cursor_y - $py
                endif
            endif
        endif
        if $savearm == 1
            if $click == 1
                $moved = 0
                $xhi = $downx + 0.012
                $xlo = $downx - 0.012
                $yhi = $downy + 0.012
                $ylo = $downy - 0.012
                if cursor_x > $xhi
                    $moved = 1
                endif
                if cursor_x < $xlo
                    $moved = 1
                endif
                if cursor_y > $yhi
                    $moved = 1
                endif
                if cursor_y < $ylo
                    $moved = 1
                endif
                if $moved == 1
                    $savearm = 0
                    $drag = 1
                    $dx = cursor_x - $px
                    $dy = cursor_y - $py
                endif
                if $onsave == 0
                    $savearm = 0
                    $drag = 1
                    $dx = cursor_x - $px
                    $dy = cursor_y - $py
                endif
            endif
        endif
        if $drag == 1
            if $click == 1
                $px = cursor_x - $dx
                $py = cursor_y - $dy
                if $px < 0
                    $px = 0
                endif
                if $py < 0
                    $py = 0
                endif
                if $px > 0.739
                    $px = 0.739
                endif
                if $py > 0.500
                    $py = 0.500
                endif
            endif
        endif
        if $click == 0
            if $prevclick == 1
                if $arm == 1
                    if $onx == 1
                        $show = 0
                    endif
                endif
                if $savearm == 1
                    if $onsave == 1
                        if z83 == 1
                            $\GlossifySkinToggles\save_request = 1
                        endif
                    endif
                endif
            endif
            $drag = 0
            $arm = 0
            $savearm = 0
        endif
    else
        $drag = 0
        $arm = 0
        $savearm = 0
        $onx = 0
        $onsave = 0
    endif
    $prevclick = $click
    if $show == 1
        x80 = $px
        y80 = $py
        z80 = 0.2604
        w80 = 0.5000
        x81 = 0
        y81 = 0
        z81 = 0
        w81 = 0
        x82 = 0
        y82 = 0
        z82 = $onx
        w82 = 0
        run = CustomShaderGlossifyToggles
        x81 = $\GlossifyBase\face_enabled
        y81 = $\GlossifyBase\body_enabled
        z81 = y83
        w81 = x83
        x82 = $\KatFXMatcap\oilSkin
        y82 = $\KatFXMatcap\oilStrength
        w82 = z83
        if z83 == 1
            if $\GlossifySkinToggles\mod_saved == 1
                x82 = $\GlossifySkinToggles\mod_style
                y82 = $\GlossifySkinToggles\mod_strength
                w82 = 2
            endif
        endif
        if $onsave == 1
            z82 = 2
        endif
        run = CustomShaderGlossifyToggles
    endif
endif
if $\GlossifySkinToggles\save_request == 1
    if z83 == 0
        $\GlossifySkinToggles\save_request = 0
    endif
endif
$\GlossifySkinToggles\prev_saved = $\GlossifySkinToggles\mod_saved
$\GlossifySkinToggles\prev_style = $\GlossifySkinToggles\mod_style
$\GlossifySkinToggles\prev_strength = $\GlossifySkinToggles\mod_strength
$\GlossifySkinToggles\mod_saved = 0
z83 = 0
