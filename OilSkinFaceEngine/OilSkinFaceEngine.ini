namespace = OilSkinFaceEngine
[Constants]
global $normal_msaa = 0
global $count = 0
global $first = 0
global $base = 0

[CommandListDrawOriginal]
if @o0 && @o3 && @oD
    handling = skip
    draw = from_caller
    $count = 0
    run = CommandListOverlay
endif

[CommandListOverlay]
if @o0 && @o3 && @oD
    run = CommandListPrepareStyle
    run = CommandList\KatFXMatcap\OilSkin
    run = CommandListFaceSaveOutputs
    $normal_msaa = 0
    checktextureoverride = o3
    if $normal_msaa == 1
        ResourceFaceNormals = copy resolve_msaa o3
    else
        ResourceFaceNormals = copy o3
    endif
    run = BuiltInCommandListUnbindAllRenderTargets
    o0 = ref ResourceFaceSavedO0
    oD = ref ResourceFaceSavedOD
    ps-t119 = ref ResourceFaceNormals
    run = CustomShaderFaceSheen
    run = CommandListFaceRestoreOutputs
    run = CommandList\KatFXMatcap\Clear
endif

[CommandListPrepareStyle]
; Accept an old saved off-style while keeping an independent per-mod switch.
if $\KatFXMatcap\oilSkin == 0
    $\KatFXMatcap\oilSkin = 2
endif

[CommandListFaceSaveOutputs]
ResourceFaceSavedO0 = ref o0
ResourceFaceSavedO1 = ref o1
ResourceFaceSavedO2 = ref o2
ResourceFaceSavedO3 = ref o3
ResourceFaceSavedO4 = ref o4
ResourceFaceSavedO5 = ref o5
ResourceFaceSavedO6 = ref o6
ResourceFaceSavedO7 = ref o7
ResourceFaceSavedOD = ref oD
ResourceFaceSavedT119 = ref ps-t119

[CommandListFaceRestoreOutputs]
ps-t119 = ref ResourceFaceSavedT119
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceFaceSavedO0
o1 = ref ResourceFaceSavedO1
o2 = ref ResourceFaceSavedO2
o3 = ref ResourceFaceSavedO3
o4 = ref ResourceFaceSavedO4
o5 = ref ResourceFaceSavedO5
o6 = ref ResourceFaceSavedO6
o7 = ref ResourceFaceSavedO7
oD = ref ResourceFaceSavedOD
ResourceFaceSavedO0 = null
ResourceFaceSavedO1 = null
ResourceFaceSavedO2 = null
ResourceFaceSavedO3 = null
ResourceFaceSavedO4 = null
ResourceFaceSavedO5 = null
ResourceFaceSavedO6 = null
ResourceFaceSavedO7 = null
ResourceFaceSavedOD = null
ResourceFaceSavedT119 = null

[CustomShaderFaceSheen]
ps = OilSkinFaceEngine/FaceOil.hlsl
blend = ADD ONE ONE
alpha = ADD ZERO ONE
alpha_to_coverage = 0
sample_mask = ffffffff
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
if $count > 0
    drawindexed = $count, $first, $base
else
    draw = from_caller
endif

[TextureOverrideFaceNormalMSAA]
match_type = Texture2D
match_bind_flags = +render_target
match_msaa = >1
$normal_msaa = 1

[ResourceFaceNormals]
bind_flags = shader_resource

[ResourceFaceSavedO0]
[ResourceFaceSavedO1]
[ResourceFaceSavedO2]
[ResourceFaceSavedO3]
[ResourceFaceSavedO4]
[ResourceFaceSavedO5]
[ResourceFaceSavedO6]
[ResourceFaceSavedO7]
[ResourceFaceSavedOD]
[ResourceFaceSavedT119]
