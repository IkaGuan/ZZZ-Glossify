; Generated by OilSkin Patcher
namespace = OilSkinVelinaLL

[Constants]
global $active = 0
global persist $saved = 0
global persist $style = 2
global persist $strength = 1
global $pushed = 0
global $hold_style = 2
global $hold_strength = 1

[Present]
post $active = 0

[CommandListCaptureSave]
if $\GlossifySkinToggles\save_request == 1
    $style = $\KatFXMatcap\oilSkin
    $strength = $\KatFXMatcap\oilStrength
    if $style == 0
        $style = 2
    endif
    $saved = 1
    $\GlossifySkinToggles\save_request = 0
endif
$\GlossifySkinToggles\mod_saved = $saved
$\GlossifySkinToggles\mod_style = $style
$\GlossifySkinToggles\mod_strength = $strength

[CommandListUseSaved]
$pushed = 0
if $saved == 1
    $hold_style = $\KatFXMatcap\oilSkin
    $hold_strength = $\KatFXMatcap\oilStrength
    $\KatFXMatcap\oilSkin = $style
    $\KatFXMatcap\oilStrength = $strength
    $pushed = 1
endif

[CommandListRestoreStock]
if $pushed == 1
    $\KatFXMatcap\oilSkin = $hold_style
    $\KatFXMatcap\oilStrength = $hold_strength
    $pushed = 0
endif

[CommandListPrepareStyle]
; Accept an old saved off-style while keeping independent body and face toggles.
if $\KatFXMatcap\oilSkin == 0
    $\KatFXMatcap\oilSkin = 2
endif

[CommandListBodyStart]
$active = 1
z83 = 1
run = CommandListCaptureSave
if (x83 == 1 || $\GlossifyBase\body_enabled == 1)
    run = CommandListUseSaved
    run = CommandListPrepareStyle
    run = CommandList\KatFXMatcap\OilSkin
    run = CommandListRestoreStock
else
    ps-t125 = null
endif

[CommandListBodyEnd]
ps-t125 = null

[CommandListFaceDraw]
$active = 1
z83 = 1
run = CommandListCaptureSave
if y83 == 1
    run = CommandListUseSaved
    run = CommandList\GlossifyFaceEngine\DrawOriginal
    run = CommandListRestoreStock
endif

[CommandListFaceOverlay]
$active = 1
z83 = 1
run = CommandListCaptureSave
if y83 == 1
    run = CommandListUseSaved
    run = CommandList\GlossifyFaceEngine\Overlay
    run = CommandListRestoreStock
endif
