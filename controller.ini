; Generated by OilSkin Patcher
namespace = OilSkinVelinaLL

[Constants]
global persist $enabled = 0
global persist $face_enabled = 1
global $active = 0

[Present]
post $active = 0

[KeyOilSkinToggle]
condition = $active == 1
key = no_modifiers VK_MULTIPLY
type = cycle
$enabled = 0,1

[KeyOilSkinFaceToggle]
condition = $active == 1
key = no_ctrl no_shift alt VK_MULTIPLY
type = cycle
$face_enabled = 0,1

[CommandListPrepareStyle]
; Accept an old saved off-style while keeping an independent per-mod switch.
if $\KatFXMatcap\oilSkin == 0
    $\KatFXMatcap\oilSkin = 2
endif

[CommandListBodyStart]
$active = 1
if $enabled == 1
    run = CommandListPrepareStyle
    run = CommandList\KatFXMatcap\OilSkin
endif

[CommandListBodyEnd]
if $enabled == 1
    run = CommandList\KatFXMatcap\Clear
endif

[CommandListFaceDraw]
$active = 1
if $enabled == 1 && $face_enabled == 1
    run = CommandList\OilSkinFaceEngine\DrawOriginal
endif

[CommandListFaceOverlay]
$active = 1
if $enabled == 1 && $face_enabled == 1
    run = CommandList\OilSkinFaceEngine\Overlay
endif
