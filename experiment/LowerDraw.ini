; Experiment: oil one draw range and leave the hair draw matte.
; Nothing in this file matches a mesh. A skin has to call these lists.
; The Parts panel row "Leg draw" turns the pass on. It starts off. Ctrl+Alt+F6 opens that panel.
; LowerBind / LowerClear wrap one drawindexed that is already only the legs.
; LowerRedraw is the other case: one draw contains hair and legs together.
; Set $leg_count, $leg_first, and $leg_base, then run LowerRedraw while that
; mesh is still bound. The redraw uses only the leg indexes.
namespace = ExperimentLower

[Constants]
global persist $lower_pass = 0
global $leg_count = 0
global $leg_first = 0
global $leg_base = 0

[CommandListLowerBind]
if $lower_pass == 1
    if $\KatFXMatcap\oilSkin == 0
        $\KatFXMatcap\oilSkin = 2
    endif
    run = CommandList\KatFXMatcap\OilSkin
endif

[CommandListLowerClear]
ps-t125 = null

[CommandListLowerRedraw]
if $lower_pass == 1 && $leg_count > 0 && @o0 && @o3 && @oD
    run = CommandListLowerBind
    run = CommandListLowerSave
    run = BuiltInCommandListUnbindAllRenderTargets
    ResourceLegNormals = copy ResourceLegSavedO3
    o0 = ref ResourceLegSavedO0
    oD = ref ResourceLegSavedOD
    ps-t119 = ref ResourceLegNormals
    run = CustomShaderLowerRedraw
    run = CommandListLowerRestore
    run = CommandListLowerClear
endif
$leg_count = 0

[CommandListLowerSave]
ResourceLegSavedO0 = ref o0
ResourceLegSavedO3 = ref o3
ResourceLegSavedOD = ref oD
ResourceLegSavedT119 = ref ps-t119

[CommandListLowerRestore]
ps-t119 = ref ResourceLegSavedT119
run = BuiltInCommandListUnbindAllRenderTargets
o0 = ref ResourceLegSavedO0
o3 = ref ResourceLegSavedO3
oD = ref ResourceLegSavedOD

[CustomShaderLowerRedraw]
ps = LowerRedraw.hlsl
blend = ADD ONE ONE
alpha = ADD ZERO ONE
alpha_to_coverage = 0
sample_mask = ffffffff
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
drawindexed = $leg_count, $leg_first, $leg_base

[ResourceLegNormals]
bind_flags = shader_resource

[ResourceLegSavedO0]
[ResourceLegSavedO3]
[ResourceLegSavedOD]
[ResourceLegSavedT119]
