; Parts panel. Ctrl+Alt+F6 opens and closes it. Click a row to turn that paint on or off.
; The game uses F1 through F5 and P. Glossify uses Ctrl+Alt+F7, F8, and F9.
; F1 stays with the game. Drag the title bar. Click X to close.
; Upper, Lower, and Arms paint stock meshes only while Glossify is disabled.
; NPC, Enemy, and Bangboo paint after you paste a hunted shader hash in GroupSplit.ini.
; Leg draw arms the lower-body pass. A skin still has to call that pass.
namespace = ExperimentPanel

[Constants]
global persist $show = 0
global persist $px = 0.74
global persist $py = 0.12
global $pw = 0.22
global $ph = 0.40
global $drag = 0
global $dx = 0
global $dy = 0
global $click = 0
global $prevclick = 0
global $arm = 0
global $row = 0
global $onx = 0
global $intitle = 0
global $x2 = 0
global $y2 = 0
global $c1x = 0
global $c2x = 0
global $c1y = 0
global $c2y = 0
global $r1 = 0
global $r2 = 0

[KeyShow]
key = ctrl alt no_shift VK_F6
type = cycle
$pulse = 0,1
run = CommandListToggleShow

[CommandListToggleShow]
if $show == 0
    $show = 1
else
    $show = 0
    $drag = 0
    $arm = 0
endif

[KeyClick]
condition = $show && cursor_showing
key = VK_LBUTTON
type = hold
$click = 1
post $click = 0

[ResourceExperimentFont]
filename = Font.dds

[CustomShaderExperimentPanel]
hs = null
ds = null
gs = null
cs = null
run = BuiltInCommandListUnbindAllRenderTargets
vs = Panel.hlsl
ps = Panel.hlsl
ps-t101 = ResourceExperimentFont
blend = ADD SRC_ALPHA INV_SRC_ALPHA
cull = none
topology = triangle_strip
o0 = set_viewport bb
Draw = 4,0

[CommandListToggleUpper]
if $\ExperimentParts\upper == 0
    $\ExperimentParts\upper = 1
else
    $\ExperimentParts\upper = 0
endif

[CommandListToggleLower]
if $\ExperimentParts\lower == 0
    $\ExperimentParts\lower = 1
else
    $\ExperimentParts\lower = 0
endif

[CommandListToggleArms]
if $\ExperimentParts\arms == 0
    $\ExperimentParts\arms = 1
else
    $\ExperimentParts\arms = 0
endif

[CommandListToggleNpc]
if $\ExperimentGroups\npc == 0
    $\ExperimentGroups\npc = 1
else
    $\ExperimentGroups\npc = 0
endif

[CommandListToggleEnemy]
if $\ExperimentGroups\enemy == 0
    $\ExperimentGroups\enemy = 1
else
    $\ExperimentGroups\enemy = 0
endif

[CommandListToggleBangboo]
if $\ExperimentGroups\bangboo == 0
    $\ExperimentGroups\bangboo = 1
else
    $\ExperimentGroups\bangboo = 0
endif

[CommandListToggleLeg]
if $\ExperimentLower\lower_pass == 0
    $\ExperimentLower\lower_pass = 1
else
    $\ExperimentLower\lower_pass = 0
endif

[CommandListHitTest]
$x2 = $px + $pw
$y2 = $py + $ph
$c1x = $px + 0.195
$c2x = $px + 0.216
$c1y = $py + 0.008
$c2y = $py + 0.044
$onx = 0
$intitle = 0
$row = 0
if cursor_x > $c1x
    if cursor_x < $c2x
        if cursor_y > $c1y
            if cursor_y < $c2y
                $onx = 1
            endif
        endif
    endif
endif
if cursor_x > $px
    if cursor_x < $x2
        if cursor_y > $py
            if cursor_y < $py + 0.048
                if $onx == 0
                    $intitle = 1
                endif
            endif
        endif
    endif
endif
if cursor_x > $px
    if cursor_x < $x2
        $r1 = $py + 0.052
        $r2 = $py + 0.096
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 1
            endif
        endif
        $r1 = $py + 0.100
        $r2 = $py + 0.144
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 2
            endif
        endif
        $r1 = $py + 0.148
        $r2 = $py + 0.192
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 3
            endif
        endif
        $r1 = $py + 0.208
        $r2 = $py + 0.252
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 4
            endif
        endif
        $r1 = $py + 0.256
        $r2 = $py + 0.300
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 5
            endif
        endif
        $r1 = $py + 0.304
        $r2 = $py + 0.348
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 6
            endif
        endif
        $r1 = $py + 0.352
        $r2 = $py + 0.396
        if cursor_y > $r1
            if cursor_y < $r2
                $row = 7
            endif
        endif
    endif
endif

[Present]
if $show == 0
    $drag = 0
    $arm = 0
else
    if cursor_showing
        run = CommandListHitTest
        if $click == 1
            if $prevclick == 0
                $arm = 0
                $drag = 0
                if $onx == 1
                    $arm = 8
                endif
                if $arm == 0
                    if $row > 0
                        $arm = $row
                    endif
                endif
                if $arm == 0
                    if $intitle == 1
                        $drag = 1
                        $dx = cursor_x - $px
                        $dy = cursor_y - $py
                    endif
                endif
            endif
        endif
        if $drag == 1
            if $click == 1
                $px = cursor_x - $dx
                $py = cursor_y - $dy
                if $px < 0
                    $px = 0
                endif
                if $py < 0
                    $py = 0
                endif
                if $px > 0.78
                    $px = 0.78
                endif
                if $py > 0.60
                    $py = 0.60
                endif
            endif
        endif
        if $click == 0
            if $prevclick == 1
                if $arm == 8
                    if $onx == 1
                        $show = 0
                    endif
                endif
                if $arm == 1
                    if $row == 1
                        run = CommandListToggleUpper
                    endif
                endif
                if $arm == 2
                    if $row == 2
                        run = CommandListToggleLower
                    endif
                endif
                if $arm == 3
                    if $row == 3
                        run = CommandListToggleArms
                    endif
                endif
                if $arm == 4
                    if $row == 4
                        run = CommandListToggleNpc
                    endif
                endif
                if $arm == 5
                    if $row == 5
                        run = CommandListToggleEnemy
                    endif
                endif
                if $arm == 6
                    if $row == 6
                        run = CommandListToggleBangboo
                    endif
                endif
                if $arm == 7
                    if $row == 7
                        run = CommandListToggleLeg
                    endif
                endif
            endif
            $drag = 0
            $arm = 0
        endif
    else
        $drag = 0
        $arm = 0
    endif
    $prevclick = $click
    if $show == 1
        run = CommandListHitTest
        x90 = $px
        y90 = $py
        z90 = $pw
        w90 = $ph
        x91 = $\ExperimentParts\upper
        y91 = $\ExperimentParts\lower
        z91 = $\ExperimentParts\arms
        w91 = $\ExperimentGroups\npc
        x92 = $\ExperimentGroups\enemy
        y92 = $\ExperimentGroups\bangboo
        z92 = $\ExperimentLower\lower_pass
        w92 = $row
        if $onx == 1
            w92 = 8
        endif
        run = CustomShaderExperimentPanel
    endif
endif
