[CommandListAllowSheen]
; Each face is tracked on its own. A new face waits one frame, then glosses.
; The street keeps glossing while another face is on screen.
run = CommandListMarkFace
$allow_sheen = $ready
; Gloss waits about one second after a face appears, so a loading model is not copied.

[CommandListDrawOriginal]
if @o0 && @o3 && @oD
    run = CommandListAllowSheen
    if $allow_sheen == 1
        handling = skip
        draw = from_caller
        $count = 0
        $auto = 0
        run = CommandListOverlay
    endif
endif

[CommandListOverlay]
; Do not unbind the color target. Closing the overview with Esc was releasing it.
if @o0 && @o3 && @oD
    run = CommandListAllowSheen
    if $allow_sheen == 1
        run = CommandList\GlossifyMemory\ApplySaved
        run = CommandList\KatFXMatcap\OilSkin
        run = CommandList\GlossifyMemory\RestoreSaved
        ResourceFaceSavedT119 = ref ps-t119
        ResourceFaceNormals = copy o3 unless_null
        ps-t119 = ref ResourceFaceNormals
        run = CustomShaderFaceSheen
        ps-t119 = ref ResourceFaceSavedT119
        ps-t125 = null
        run = CommandList\GlossifyMemory\RestoreSaved
    endif
endif


[CustomShaderFaceSheen]
ps = GlossifyFaceEngine/FaceOil.hlsl
blend = ADD ONE ONE
alpha = ADD ZERO ONE
alpha_to_coverage = 0
sample_mask = ffffffff
depth_enable = true
depth_write_mask = zero
depth_func = equal
stencil_enable = false
if $count > 0
    drawindexed = $count, $first, $base
else if $auto == 1
    drawindexed = auto
else
    draw = from_caller
endif
$auto = 0

[ResourceFaceNormals]
; Each face draw takes its own normal picture. One picture for the whole frame
; left the ribbon in the buffer, and the cheek was painted from that.
max_copies_per_frame = 32
bind_flags = shader_resource

