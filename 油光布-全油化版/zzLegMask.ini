; Namespace sorts after KatFXMatcap, so this regex sees the oil sample.
; The height mask is off. x123 stays 0. Do not put that regex back here.
; This seal only matches a shader that samples t125, then clears it after the draw.
; The pre command oils draws that no agent section claimed.
; There is no replace block, so the oil shader text stays as OilSkin wrote it.
namespace = zGlossifyLegMask

[ShaderRegexGlossifySeal]
shader_model = ps_4_0 ps_5_0
run = CommandList\GlossifyBase\WorldBeforeDraw
post run = CommandList\GlossifyBase\SealAfterDraw

[ShaderRegexGlossifySeal.Pattern]
sample_indexable\(texture2d\)\(float,float,float,float\) r\d+\.xyzw, r\d+\.[xyzw]{4}, t125\.xyzw, s\d+
