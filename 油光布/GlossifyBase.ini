; GlossifyBase. Stock face and body gloss. Hashes are hardcoded and change when the game updates meshes.
; Body overrides only bind the oil. Priority -1 loses to a skin mod on the same hash.
namespace = GlossifyBase
[Constants]
global persist $face_enabled = 1
global persist $body_enabled = 0
global $pushed = 0
global $hold_style = 2
global $hold_strength = 1
global $leg_hold = 0

[KeyFace]
key = ctrl alt no_shift VK_F8
type = cycle
smart = false
$face_enabled = 0,1

[KeyBody]
key = ctrl alt no_shift VK_F9
type = cycle
smart = false
$body_enabled = 0,1

[CommandListBaseFace]
; Stock faces only. A patched mod sets its own face flag and does not use this list.
if $face_enabled == 1
    run = CommandList\GlossifyFaceEngine\DrawOriginal
endif

[CommandListPatchedFace]
; Use this mod's saved look for this draw, then put the stock values back.
$pushed = 0
if $\GlossifySkinToggles\mod_saved == 1
    $hold_style = $\KatFXMatcap\oilSkin
    $hold_strength = $\KatFXMatcap\oilStrength
    $\KatFXMatcap\oilSkin = $\GlossifySkinToggles\mod_style
    $\KatFXMatcap\oilStrength = $\GlossifySkinToggles\mod_strength
    $pushed = 1
else if $\GlossifySkinToggles\prev_saved == 1
    $hold_style = $\KatFXMatcap\oilSkin
    $hold_strength = $\KatFXMatcap\oilStrength
    $\KatFXMatcap\oilSkin = $\GlossifySkinToggles\prev_style
    $\KatFXMatcap\oilStrength = $\GlossifySkinToggles\prev_strength
    $pushed = 1
endif
if @o3
    run = CommandList\GlossifyFaceEngine\DrawOriginal
else
    run = CommandListFaceNoNormal
endif
if $pushed == 1
    $\KatFXMatcap\oilSkin = $hold_style
    $\KatFXMatcap\oilStrength = $hold_strength
endif

[CommandListReleaseOil]
; Drop the oil map only. The full oil clear also unbinds other slots and can black the next mesh.
ps-t125 = null
x123 = 0
run = CommandList\GlossifyMemory\RestoreSaved

; While a hair draw is splitting into several mod draws, keep the oil bound.
; The hair section's post clears it before the next mesh.
[CommandListSealAfterDraw]
if $leg_hold == 0
    run = CommandListReleaseOil
endif

; The seal that clears t125 is in zzLegMask.ini. This namespace sorts before
; KatFXMatcap, so a pattern here would run before the oil sample exists.

[CommandListBaseBody]
; Bind the oil and let the game draw. Do not skip or redraw, so a skin mod can keep its mesh.
; Off clears the oil before the draw. A plain cycle can stick on the current value, so smart is off.
x123 = 0
if $body_enabled == 1
    run = CommandList\GlossifyMemory\ApplySaved
    run = CommandList\KatFXMatcap\OilSkin
    run = CommandList\GlossifyMemory\RestoreSaved
else
    run = CommandListReleaseOil
endif

; The height mask is off. The t125 seal is the only regex left, and it lives in zzLegMask.ini.

[Present]
post $leg_hold = 0
post x123 = 0

[CommandListFaceNoNormal]
; No OilSkin call. That path on a face without a normal target froze the machine.
run = CommandList\GlossifyMemory\ApplySaved
handling = skip
run = CommandList\GlossifyMemory\RestoreSaved
draw = from_caller
run = CustomShaderFaceNoNormal
run = CommandListReleaseOil

[CustomShaderFaceNoNormal]
ps = FaceFallback.hlsl
blend = ADD ONE ONE
alpha = ADD ZERO ONE
depth_enable = true
depth_write_mask = zero
depth_func = equal
cull = none
draw = from_caller

